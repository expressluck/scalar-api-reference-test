openapi: 3.1.0
info:
  title: Sales Customer APIs
  version: 1.0.0
paths:
  /sales/customers:
    get:
      tags:
        - Sales / Customer
      operationId: listSalesCustomers
      summary: List customers
      description: Returns a paginated customer list used by sales operations.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number.
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page.
      responses:
        "200":
          description: Customer list response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        customerId:
                          type: string
                          example: CUST-1001
                        name:
                          type: string
                          example: Acme Corp
                        tier:
                          type: string
                          example: Gold
                  page:
                    type: integer
                    example: 1
    post:
      tags:
        - Sales / Customer
      operationId: createSalesCustomer
      summary: Create customer
      description: Creates a new sales customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - tier
              properties:
                name:
                  type: string
                  example: New Retail Account
                tier:
                  type: string
                  enum:
                    - Bronze
                    - Silver
                    - Gold
      responses:
        "201":
          description: Customer created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                    example: CUST-2450
  /sales/customers/{customerId}:
    get:
      tags:
        - Sales / Customer
      operationId: getSalesCustomer
      summary: Get customer by ID
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                    format: email